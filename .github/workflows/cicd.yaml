name: Streamlit CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  # Allows you to run the workflow manually
  workflow_dispatch:

# Prevent concurrent Render deployments
concurrency:
  group: agentic-chatbot-render
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall -q app.py backend.py

  deploy:
    name: Deploy to Render
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

